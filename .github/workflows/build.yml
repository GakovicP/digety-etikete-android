name: Build Android + iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :composeApp:assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: |
          mkdir -p out
          cp composeApp/build/outputs/apk/release/composeApp-release.apk out/NetPlanet-link-1.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Kotlin framework (iOS simulator)
        run: gradle :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
      - name: Xcode projekat
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build iOS (simulator)
        run: |
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            KMP_PREBUILT=YES KMP_FRAMEWORK_DIR="$GITHUB_WORKSPACE/composeApp/build/bin/iosSimulatorArm64/debugFramework" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.1.${{ github.run_number }} \
            build | tail -200
          test -d build/Build/Products/Debug-iphonesimulator/NetPlanetLink.app
      - name: Test - pokreni u iPhone simulatoru i snimi ekran
        continue-on-error: true
        run: |
          APP=iosApp/build/Build/Products/Debug-iphonesimulator/NetPlanetLink.app
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          DEV=$(xcrun simctl create test-iphone "iPhone 16" "$RUNTIME" 2>/dev/null || xcrun simctl create test-iphone "iPhone 15" "$RUNTIME")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.gakovic.etikete
          sleep 25
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/ios.png
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "NetPlanetLink"' --style compact | tail -60 > shots/ios-log.txt || true
      - name: Objavi snimke (Release test-screens)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/ 2>/dev/null || exit 0
          for f in shots/*; do mv "$f" "shots/ios-run${{ github.run_number }}-$(basename "$f")"; done
          gh release view test-screens -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create test-screens -R ${{ github.repository }} --title "Test snimci ekrana" --notes "Automatski snimci ekrana iz testa pokretanja (simulator/emulator)." --prerelease
          gh release upload test-screens shots/* -R ${{ github.repository }} --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshot
          path: shots/
          if-no-files-found: ignore
      - name: Zip .app
        run: |
          mkdir -p out
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/out/NetPlanet-link-1.1.${{ github.run_number }}-iOS-simulator.zip" NetPlanetLink.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: out/*.zip

  # Real iPhone build (arm64, iphoneos), NOT signed. It goes through the same
  # Xcode "Build Kotlin framework" phase you use locally, so it also checks that path.
  # The .ipa can be installed with a free Apple ID using Sideloadly or AltStore
  # (they re-sign it with your account; valid 7 days). See docs/iPhone-install.md.
  ios-device:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Xcode projekat
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build iOS (iPhone, unsigned)
        run: |
          # Simulate a Mac with only an empty Android SDK folder (like the brew command-line tools)
          mkdir -p "$RUNNER_TEMP/empty-android-sdk"
          export ANDROID_HOME="$RUNNER_TEMP/empty-android-sdk" ANDROID_SDK_ROOT="$RUNNER_TEMP/empty-android-sdk"
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.1.${{ github.run_number }} \
            build | tail -200
          test -d build/Build/Products/Release-iphoneos/NetPlanetLink.app
      - name: Pack unsigned .ipa
        run: |
          mkdir -p out ipa/Payload
          cp -R iosApp/build/Build/Products/Release-iphoneos/NetPlanetLink.app ipa/Payload/
          lipo -info ipa/Payload/NetPlanetLink.app/NetPlanetLink
          cd ipa && zip -qry "$GITHUB_WORKSPACE/out/NetPlanet-link-1.1.${{ github.run_number }}-iPhone-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-device-ipa
          path: out/*.ipa

  android-test:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Test - pokreni u Android emulatoru i snimi ekran
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb shell am start -n com.gakovic.etikete/.MainActivity
            sleep 20
            mkdir -p shots
            adb exec-out screencap -p > shots/android.png
            adb logcat -d -t 300 | grep -iE "etikete|AndroidRuntime|FATAL" > shots/android-log.txt || true
      - name: Objavi snimke (Release test-screens)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/ 2>/dev/null || exit 0
          for f in shots/*; do mv "$f" "shots/android-run${{ github.run_number }}-$(basename "$f")"; done
          gh release view test-screens -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create test-screens -R ${{ github.repository }} --title "Test snimci ekrana" --notes "Automatski snimci ekrana iz testa pokretanja (simulator/emulator)." --prerelease
          gh release upload test-screens shots/* -R ${{ github.repository }} --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshot
          path: shots/
          if-no-files-found: ignore

  release:
    needs: [android, ios, ios-device]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ios-device-ipa
          path: out
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: NetPlanet link 1.1.${{ github.run_number }}
          body: |
            Automatski build iz commit-a ${{ github.sha }}.
            - **Android:** preuzmi .apk i instaliraj na telefon.
            - **iOS (simulator):** .zip sa NetPlanetLink.app - za iPhone simulator na Mac-u ili za testiranje u browseru (Appetize.io).
            - **iOS (pravi iPhone):** `-iPhone-unsigned.ipa` - instalira se besplatnim Apple ID-jem preko Sideloadly/AltStore (važi 7 dana). Ili iz Xcode-a, vidi docs/iPhone-install.md.
          files: out/*
          make_latest: true
